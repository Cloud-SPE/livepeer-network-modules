# Example host-config.yaml for the capability broker.
#
# For a standalone broker rollout, this file is the operator's day-to-day
# runtime surface. Edit, reload, and re-publish the manifest without rebuilding
# the broker binary.
#
# In a pool-managed rollout, `pool-controller` owns the canonical offer/member
# state and stages the broker runtime artifact that the broker reloads.
#
# This example is intentionally conservative: it starts with simple HTTP
# request/response capabilities and keeps more operationally involved shapes
# (third-party API resale, multi-backend pools) commented out until the
# operator is ready to wire the required backend infrastructure.
#
# Some commented examples below reference workload binaries that used to live
# in this repo. Those component trees were removed on 2026-05-20; keep the
# examples only as contract-shape references when wiring your own backends.
#
# NOTE: the v0 interaction-mode drivers (http-reqresp, http-stream, RTMP,
# session-control, live-runner, ...) have been removed from the broker; the
# `interaction_mode` strings below are retained only as labels for the
# published manifest. v1 protocol (paid-job / paid-session) capability
# examples land with the new protocol engines.

identity:
  orch_eth_address: 0x1234567890abcdef1234567890abcdef12345678
  label: "broker-a"

# Optional private admin auth for runtime-status and reload endpoints.
# When omitted, /admin/v1/runtime* stays disabled.
#
# admin_auth:
#   method: bearer
#   secret_ref: env://BROKER_ADMIN_TOKEN

listen:
  paid: ":8080"
  metrics: ":9090"

# Path to the co-located payment-daemon unix socket. The broker dials this
# at startup and fails fast if the daemon is unreachable.
#
# Set `mock: true` to use the in-process Mock client instead — useful for
# unit tests and the broker's standalone smoke script (no payment-daemon
# container required). The Mock still requires a well-formed
# Livepeer-Payment envelope; only the gRPC + BoltDB plumbing is bypassed.
payment_daemon:
  socket: /var/run/livepeer/payment-daemon.sock
  # mock: true

# Optional best-effort receipt sink for Pool accounting. When set, the broker
# posts `stub` and `final` work receipts to pool-controller's admin API without
# failing paid traffic if the sink is unavailable.
#
# receipt_sink:
#   url: "http://pool-controller:8080"
#   timeout_ms: 1500
#   auth:
#     method: "bearer"
#     secret_ref: "env://POOL_CONTROLLER_TOKEN"

# Optional read-only Pool snapshot source. When set, the broker polls
# pool-controller's backend-selection snapshot and surfaces freshness / entry
# status on GET /registry/health. This first slice does not alter routing yet.
#
# pool_snapshot:
#   url: "http://pool-controller:8080"
#   timeout_ms: 1500
#   poll_interval_ms: 5000
#   stale_after_ms: 15000
#   expire_after_ms: 60000
#   auth:
#     method: "bearer"
#     secret_ref: "env://POOL_CONTROLLER_TOKEN"

capabilities:
  # Pricing assumptions used across this file:
  # - ETH = $2,900 planning rate (re-derive wei when ETH moves materially)
  # - All prices below are WHOLESALE (orch ↔ gateway), in wei.
  #   Customer-facing USD retail markup lives in the gateway service.
  # - Each price is MARKET-ANCHORED, not cost-floor-anchored. Formula:
  #     retail   = hyperscale_retail × (1 − workload_discount)
  #     wholesale = retail / (1 + gateway_margin)   # gateway_margin = 30%
  # - Workload discount varies by commoditization AND deployed GPU tier.
  #   See "Part 3 — Market-anchored pricing" in
  #   docs/design-docs/pricing-overview.md for the full table.
  # - For resale offerings (proxying to OpenAI/Anthropic/etc.) the math
  #   inverts: wholesale = upstream_cost × (1 + orch_markup). Discount
  #   bands do not apply to resale.
  # - Hardware tier noted per capability; re-derive if changing cards.
  # - Cost-floor check: confirm market-anchored price clears the four-lens
  #   floor (Part 2 of pricing-overview.md). When it does not — see the
  #   Llama 70B note below — the workload is structurally unprofitable on
  #   that hardware at competitive pricing.

  # ---- Simple HTTP request/response examples ----
  - id: "kibble:doggo-bark-counter:v1"
    offering_id: "default"
    interaction_mode: "http-reqresp@v0"
    work_unit:
      name: "barks"
      extractor: { type: "response-jsonpath", path: "$.bark_count" }
    health:
      probe:
        type: "http-status"
        interval_ms: 5000
        timeout_ms: 1500
        unhealthy_after: 2
        healthy_after: 1
        config:
          url: "http://localhost:9000/healthz"
    # Demo placeholder — symbolic price, not a real-world rate.
    price:
      amount_wei: "100"
      per_units: 1
    backend:
      transport: "http"
      url: "http://localhost:9000/count"
      auth: "none"

  # ---- A second request/response example ----
  - id: "demo:echo:v1"
    offering_id: "default"
    interaction_mode: "http-reqresp@v0"
    work_unit:
      name: "echoes"
      extractor: { type: "response-jsonpath", path: "$.count", default: 1 }
    health:
      probe:
        type: "http-jsonpath"
        interval_ms: 5000
        timeout_ms: 1500
        unhealthy_after: 2
        healthy_after: 1
        config:
          url: "http://localhost:9001/healthz"
          path: "$.ready"
          equals: "true"
    # Demo placeholder — symbolic price, not a real-world rate.
    price:
      amount_wei: "10"
      per_units: 1
    backend:
      transport: "http"
      url: "http://localhost:9001/echo"
      auth: "none"

  # ---- Video VOD ABR (offline path; consumed by an upstream video gateway,
  # out-of-repo as of 2026-05-19) ----
  # The current video product model routes all offline video work through
  # `video:transcode.abr`, including one-rendition jobs. The gateway talks
  # directly to the backend API when `extra.abr_backend_url` (or one of the
  # other backend URL hints) is present in the published manifest.
  #
  # - id: "video:transcode.abr"
  #   offering_id: "default"
  #   interaction_mode: "http-reqresp@v0"
  #   work_unit:
  #     name: "jobs"
  #     extractor: { type: "request-formula", expression: "1", default: 1 }
  #   # Market-anchored: Mux $0.024/min × 0.75 (transcoding 25% discount,
  #   # 3090 budget tier) = $0.018/min retail → $0.0139/job wholesale at
  #   # 30% gateway margin (1-min representative job).
  #   # NB: per-job pricing is coarse — long or multi-rendition jobs are
  #   # under-priced here. Switch to `megapixel_frame` work_unit when job
  #   # size distribution is wide.
  #   price:
  #     amount_wei: "4800000000000"  # 4.8 Twei/job
  #     per_units: 1
  #   backend:
  #     transport: "http"
  #     url: "http://video_transcode_backend:8080/v1/video/transcode/abr"
  #     auth: "none"
  #   extra:
  #     provider: "video-transcode-backend"
  #     video:
  #       task: "abr-transcode"
  #     abr_backend_url: "http://video_transcode_backend:8080"
  #     # Optional stable fields like video.presets, video.codecs,
  #     # video.packaging, and video.hardware.gpu_vendor may be
  #     # auto-hydrated from GET /v1/video/transcode/abr/presets.
  #   constraints:
  #     tier: "standard"
  #     gpu_vendor: "NVIDIA"

  # ---- Additional shipped examples (uncomment when your deployment is ready) ----
  #
  # ---- Multi-backend shared offering example ----
  # Repeating the same `(id, offering_id)` publishes one manifest tuple while
  # giving the broker multiple candidate backends to choose from at request
  # time. This is the shape `pool-controller/` emits for Pool members.
  #
  # - id: "openai:chat-completions"
  #   offering_id: "llama-3-70b-shared"
  #   interaction_mode: "http-stream@v0"
  #   work_unit:
  #     name: "tokens"
  #     extractor: { type: "openai-usage", field: "total_tokens" }
  #   # Market-anchored: Together.ai $0.88/M × 0.90 (LLM-open 10% discount,
  #   # H100 premium tier) = $0.792/M retail → $0.609/M wholesale at 30%
  #   # gateway margin = $6.09e-7 per token.
  #   #
  #   # WARNING — STRUCTURAL: at 250 tok/s sustained, 900K tok/hr × $6.09e-7
  #   # = $0.55/hr revenue, vs ~$4/hr H100 cost floor. The workload only
  #   # clears the floor at ~1,800+ tok/s aggregate (heavy vLLM batching).
  #   # See Part 3 of pricing-overview.md for the "structurally unprofitable"
  #   # decision tree. Consider Llama-8B or quantized 2× consumer instead.
  #   price:
  #     amount_wei: "210000000"      # 210 Mwei/token
  #     per_units: 1
  #   backend:
  #     id: "member-west"
  #     transport: "http"
  #     url: "http://10.0.0.5:8000/v1/chat/completions"
  #     auth: "none"
  #   extra:
  #     openai:
  #       model: "llama-3-70b"
  #     provider: "vllm"
  #
  # - id: "openai:chat-completions"
  #   offering_id: "llama-3-70b-shared"
  #   interaction_mode: "http-stream@v0"
  #   work_unit:
  #     name: "tokens"
  #     extractor: { type: "openai-usage", field: "total_tokens" }
  #   # Same offering, second pool member — must publish the SAME price as
  #   # member-west or the pool advertises an inconsistent tuple.
  #   price:
  #     amount_wei: "210000000"      # 210 Mwei/token (matches member-west)
  #     per_units: 1
  #   backend:
  #     id: "member-east"
  #     transport: "http"
  #     url: "http://10.0.0.6:8000/v1/chat/completions"
  #     auth:
  #       method: "bearer"
  #       secret_ref: "env://MEMBER_EAST_TOKEN"
  #   extra:
