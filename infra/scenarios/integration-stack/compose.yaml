name: livepeer-wholesale-pilot

services:
  payee:
    image: ${PAYMENT_IMAGE:?set PAYMENT_IMAGE to a pinned livepeer-payment-daemon image digest}
    command:
      - --mode=receiver
      - --socket=/var/run/livepeer/payment-daemon.sock
      - --db=/var/lib/livepeer/payment-daemon/sessions.db
      - --chain-rpc-urls=${CHAIN_RPC_URLS:?set CHAIN_RPC_URLS}
      - --orch-address=${ORCH_ETH_ADDRESS:?set ORCH_ETH_ADDRESS}
      - --keystore-path=/run/secrets/payee-keystore.json
      - --keystore-password-file=/run/secrets/payee-keystore-password
      - --payee-admin-token=${PAYEE_ADMIN_TOKEN:?set PAYEE_ADMIN_TOKEN}
      - --metrics-listen=0.0.0.0:9092
    ports:
      - "127.0.0.1:${PAYEE_METRICS_PORT:-9413}:9092"
    volumes:
      - payee-run:/var/run/livepeer
      - payee-state:/var/lib/livepeer/payment-daemon
      - ${PAYEE_KEYSTORE:?set PAYEE_KEYSTORE}:/run/secrets/payee-keystore.json:ro
      - ${PAYEE_KEYSTORE_PASSWORD_FILE:?set PAYEE_KEYSTORE_PASSWORD_FILE}:/run/secrets/payee-keystore-password:ro
    restart: unless-stopped

  broker:
    image: ${BROKER_IMAGE:?set BROKER_IMAGE to a pinned livepeer-capability-broker image digest}
    command: [--config=/etc/livepeer/host-config.yaml]
    environment:
      BROKER_ADMIN_TOKEN: ${BROKER_ADMIN_TOKEN:?set BROKER_ADMIN_TOKEN}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PAID_PORT:-8411}:8080"
      - "${BIND_ADDR:-127.0.0.1}:${METRICS_PORT:-9412}:9090"
    volumes:
      - ./run/host-config.yaml:/etc/livepeer/host-config.yaml:ro
      - ./run/seal.key:/run/secrets/seal.key:ro
      - ./run/settlement.key:/run/secrets/settlement.key:ro
      - payee-run:/var/run/livepeer
      - broker-state:/var/lib/livepeer
    depends_on: [payee]
    restart: unless-stopped

  runner:
    image: ${RUNNER_IMAGE:?set RUNNER_IMAGE to a pinned livepeer-conformance image digest}
    environment:
      BROKER_ADMIN_TOKEN: ${BROKER_ADMIN_TOKEN:?set BROKER_ADMIN_TOKEN}
    command:
      - --broker-url=http://broker:8080
      - --serve-runner
      - --fakes-listen=0.0.0.0
      - --fakes-advertise=runner
      - --fakes-backend-port=8091
      - --fakes-runner-port=8092
      - --job-unit=${WORK_UNIT:-tokens}
      - --session-unit=${SESSION_WORK_UNIT:-participant_minutes}
    depends_on: [broker]
    restart: unless-stopped

  payer:
    image: ${PAYMENT_IMAGE:?set PAYMENT_IMAGE to a pinned livepeer-payment-daemon image digest}
    command:
      - --mode=sender
      - --socket=/var/run/livepeer/payer-daemon.sock
      - --db=/var/lib/livepeer/payment-daemon/sender.db
      - --chain-rpc-urls=${CHAIN_RPC_URLS:?set CHAIN_RPC_URLS}
      - --keystore-path=/run/secrets/payer-keystore.json
      - --keystore-password-file=/run/secrets/payer-keystore-password
      - --max-payment-wei=${MAX_PAYMENT_WEI:?set MAX_PAYMENT_WEI}
      - --max-ticket-face-value-wei=${MAX_TICKET_FACE_VALUE_WEI:?set MAX_TICKET_FACE_VALUE_WEI}
      - --max-authorization-wei=${MAX_AUTHORIZATION_WEI:?set MAX_AUTHORIZATION_WEI}
      - --max-price-per-unit=${WORK_UNIT:-tokens}=${MAX_PRICE_PER_UNIT_WEI:?set MAX_PRICE_PER_UNIT_WEI},${SESSION_WORK_UNIT:-participant_minutes}=${SESSION_MAX_PRICE_PER_UNIT_WEI:?set SESSION_MAX_PRICE_PER_UNIT_WEI}
      - --metrics-listen=0.0.0.0:9092
    volumes:
      - payer-run:/var/run/livepeer
      - payer-state:/var/lib/livepeer/payment-daemon
      - ${PAYER_KEYSTORE:?set PAYER_KEYSTORE}:/run/secrets/payer-keystore.json:ro
      - ${PAYER_KEYSTORE_PASSWORD_FILE:?set PAYER_KEYSTORE_PASSWORD_FILE}:/run/secrets/payer-keystore-password:ro
    restart: unless-stopped

  probe:
    image: ${PAYMENT_IMAGE:?set PAYMENT_IMAGE to a pinned livepeer-payment-daemon image digest}
    entrypoint: [/usr/local/bin/livepeer-chain-probe]
    profiles: [pilot]
    volumes:
      - payer-run:/var/run/livepeer/payer
      - payee-run:/var/run/livepeer/payee
      - probe-state:/var/lib/livepeer/payment-daemon
    depends_on: [payer, payee, broker, runner]

volumes:
  payer-run: {}
  payee-run: {}
  payer-state: {}
  payee-state: {}
  broker-state: {}
  probe-state: {}
