# Capability Broker host-config — OpenAI Chat Completions, lean.
#
# Same architecture as openai-chat-runner.example.yaml, but the
# per-model fields (served_model_name, backend_model, parsers,
# context_length, quantization, features) are HYDRATED FROM THE RUNNER
# at startup and on every refresh tick. The host-config only declares
# identity, price, and the model alias clients should request.
#
# To change parsers / context length / backend model for a deployment,
# bump the env vars on openai-chat-runner — no broker restart needed.
#
# Pair with:
#   - openai-runners/compose/docker-compose.vllm.chat.yml
#   - openai-runners/compose/docker-compose.openai-chat-runner.yml

identity:
  orch_eth_address: 0xYOUR_ORCH_ADDRESS
  label: "chat-broker"

listen:
  paid: ":8080"
  metrics: ":9090"

payment_daemon:
  socket: /var/run/livepeer/payment-daemon.sock

capabilities:
  - id: "openai:chat-completions"
    offering_id: "vllm-qwen3.6-27b-stream"
    interaction_mode: "http-stream@v0"
    work_unit:
      name: "tokens"
      extractor:
        type: "response-trailer"
        trailer: "X-Livepeer-Work-Units"
        default: 0
    health:
      probe:
        type: "http-status"
        interval_ms: 5000
        timeout_ms: 1500
        unhealthy_after: 2
        healthy_after: 1
        config:
          url: "http://openai_chat_runner:8080/healthz"
    price:
      amount_wei: "25000000"
      per_units: 1
    backend:
      transport: "http"
      url: "http://openai_chat_runner:8080/v1/chat/completions"
      auth: "none"
    extra:
      openai:
        model: "Qwen3.6-27B"
      provider: "openai-chat-runner"
      # served_model_name, backend_model, parsers, features, context_length,
      # quantization are hydrated from the runner's /options endpoint.
      # Set any of them here if you want to pin a value — operator entries
      # always win over discovered ones.
    constraints:
      tier: "standard"
      gpu: "5090"

  - id: "openai:chat-completions"
    offering_id: "vllm-qwen3.6-27b-default"
    interaction_mode: "http-reqresp@v0"
    work_unit:
      name: "tokens"
      extractor:
        type: "openai-usage"
        field: "total_tokens"
    health:
      probe:
        type: "http-status"
        interval_ms: 5000
        timeout_ms: 1500
        unhealthy_after: 2
        healthy_after: 1
        config:
          url: "http://openai_chat_runner:8080/healthz"
    price:
      amount_wei: "25000000"
      per_units: 1
    backend:
      transport: "http"
      url: "http://openai_chat_runner:8080/v1/chat/completions"
      auth: "none"
    extra:
      openai:
        model: "Qwen3.6-27B"
      provider: "openai-chat-runner"
    constraints:
      tier: "standard"
      gpu: "5090"
