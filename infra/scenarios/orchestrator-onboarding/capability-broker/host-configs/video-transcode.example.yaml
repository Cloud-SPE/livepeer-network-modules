# Capability Broker host-config — video transcode (VOD, ABR, live).
#
# Advertises the three transcode capabilities the catalog knows
# (templates/video-transcode-{vod,abr,live}.yaml), served by whatever
# transcode-runner, abr-runner and live-runner attach and declare them.
# The offers here are the same commercial terms the pool-controller would
# push from those templates; this file is the standalone-orchestrator
# spelling of them.
#
# Note what is NOT in this file: no backend URL, no work unit, no
# extractor, no transports, no health probe, no create/status/terminate
# paths. Those are facts the runner knows about itself, and it declares
# them at GET /.well-known/livepeer-runner when the pool member agent
# attaches it (livepeer-network-protocol/protocols/runner-contract.md,
# runner-attach.md). The operator authors the commercial terms —
# capability, price, capacity, metadata, session policy, and the
# certification a runner must pass.
#
# Three things differ from the chat example:
#
#   1. No `match:`. A transcoder is not a model, so its identity carries
#      only `provider` and the catalog's templates select on nothing:
#      any runner declaring the capability + protocol qualifies. If you
#      run two encoders behind one capability and want to sell only one,
#      add `match: { identity.provider: transcode-runner }`.
#
#   2. Certification fetches and writes media over HTTP. The VOD and ABR
#      smoke steps hand the runner a run-scoped source URL
#      ({{fixture_url.video/mp4-2s-720p}}) and sink URL ({{sink_url}})
#      that the broker mints from `external_base_url`; the runner must be
#      able to reach that address. The fixture itself is NOT shipped with
#      the broker: put a 2-second 720p clip at
#      <certification_fixtures_dir>/video/mp4-2s-720p.mp4, e.g.
#        ffmpeg -f lavfi -i testsrc=size=1280x720:rate=30 -t 2 -pix_fmt yuv420p \
#               fixtures/video/mp4-2s-720p.mp4
#      A missing fixture fails the smoke step as `substitution_missing`,
#      naming the ref, before anything is sent to the runner.
#
#   3. Live is `paid-session/v1`. Its data plane is external (the caller
#      connects to the runner's rtmp_url / hls_url directly), so the
#      broker needs `session_store` and `external_base_url` for the usage
#      callback, and the live runner needs its own public address in
#      LIVEPEER_PUBLIC_URL (plan 0046) — on a standalone host that is
#      yours to set on the container; the pool sets it for members.

identity:
  orch_eth_address: 0xYOUR_ORCH_ADDRESS
  label: "transcode-broker"
  # Hot secp256k1 key this broker signs settlement records with. Mint:
  #   livepeer-capability-broker settlement-key generate --out /opt/livepeer/broker-settlement.key
  # The broker announces it at GET /registry/settlement-keys and the
  # coordinator delegates it in the next signed manifest. Without it,
  # settlement records go out UNSIGNED. Uncomment once the file is mounted.
  # settlement_key_file: /etc/livepeer/broker-settlement.key

# Required here for two reasons: run-scoped fixture/sink URLs during VOD
# and ABR certification, and the session usage callback for live. Runners
# reach it over plain HTTP; use the address they can actually dial.
external_base_url: "http://192.168.120.6:8080"

listen:
  paid: ":8080"
  metrics: ":9090"
  # Runners attach here over QUIC; the WebSocket fallback rides :8080.
  attach_quic: ":8443"

# Needed to mint a runner's attach credential with POST /admin/v1/enroll.
admin_auth:
  method: bearer
  secret_ref: env://BROKER_ADMIN_TOKEN

# Attach credentials, sealed at rest (only sha256(token) is stored).
# Paths are inside the broker container: /var/lib/livepeer is the durable
# volume the scenario compose mounts, /etc/livepeer holds read-only material
# bind-mounted from the host (see .env.example: BROKER_SEAL_KEY).
credential_store:
  path: /var/lib/livepeer/credentials.db
  sealing_key_file: /etc/livepeer/broker-seal.key

# Session state for the live offer: leases, runway, heartbeats. The same
# seal key is fine; path and key must be set together.
session_store:
  path: /var/lib/livepeer/state.db
  sealing_key_file: /etc/livepeer/broker-seal.key

# Frozen offer shapes survive a restart here. Without it a restarted broker
# re-freezes from whichever runner certifies first — a silent manifest change.
offers_state_path: /var/lib/livepeer/offers.db

# Where {{fixture_url.<ref>}} refs resolve: <dir>/<ref>.<any extension>.
# Bind-mount a host directory holding video/mp4-2s-720p.mp4 here.
certification_fixtures_dir: /etc/livepeer/fixtures

payment_daemon:
  socket: /var/run/livepeer/payment-daemon.sock

offers:
  # ---------------------------------------------------------------------
  # VOD: file in, file out, streamed ffmpeg -progress as the response body.
  # Priced per job (per_units 1000 keeps the wei figure integral), so a
  # caller knows the cost before submitting and the pool absorbs clip
  # length variance. Anchor: AWS MediaConvert Basic-tier AVC HD
  # (2026-09-05-transcode-megapixel-pricing-correction.md).
  # ---------------------------------------------------------------------
  - offering_id: "vod-default"
    capability: "video:transcode.vod"
    protocol: "paid-job/v1"
    price:
      amount_wei: "1629000000000"
      per_units: 1000
    capacity:
      max_in_flight: 2
      queue_limit: 2
    extra:
      provider: "transcode-runner"
      video:
        task: "transcode"        # the broker validates this value per capability
    constraints:
      tier: "standard"
      gpu_vendor: "NVIDIA"
      region: "us-central"
    certification:
      - { name: ready, type: readiness, config: { attempts: 3, interval_ms: 2000 } }
      # The runner fetches the fixture from the broker, encodes one
      # rendition, PUTs it to the sink, and streams progress the whole way.
      - name: smoke
        type: request
        timeout_ms: 60000
        config:
          transport: stream
          # The runner selects the streamed transport on Accept and answers
          # 406 sse_transport_required without it. Paid traffic carries the
          # caller's Accept; certification must say so itself.
          headers: { Accept: text/event-stream }
          body:
            schema: video-transcode-vod/v2
            workload_id: "cert-{{run.id}}"
            input: { download_url: "{{fixture_url.video/mp4-2s-720p}}" }
            rendition: { name: "720p", width: 1280, height: 720, fps: 30 }
            output:
              stream: { artifact_uri: "cert://720p.mp4", upload_url: "{{sink_url}}/720p.mp4" }
      # Runs the runner's declared extractor over the streamed progress
      # (ffmpeg-progress, frames of a 2 s / 30 fps clip) and proves it
      # counts: a broken progress stream reports 0.
      - { name: usage, type: usage, config: { min_units: 40 } }
      - { name: latency, type: latency, required: false, config: { samples: 2, p50_max_ms: 20000 } }
    recertify_every_seconds: 3600

  # ---------------------------------------------------------------------
  # ABR: one source in, a rendition ladder out. Same per-job price as VOD:
  # a three-rendition ladder and a one-rendition ladder cost the same.
  # ---------------------------------------------------------------------
  - offering_id: "abr-default"
    capability: "video:transcode.abr"
    protocol: "paid-job/v1"
    price:
      amount_wei: "1629000000000"
      per_units: 1000
    capacity:
      max_in_flight: 2
      queue_limit: 2
    extra:
      provider: "abr-runner"
      video:
        task: "abr-transcode"
    constraints:
      tier: "standard"
      gpu_vendor: "NVIDIA"
      region: "us-central"
    certification:
      - { name: ready, type: readiness, config: { attempts: 3, interval_ms: 2000, consecutive: 1 } }
      - name: smoke
        type: request
        timeout_ms: 60000
        config:
          transport: stream
          headers: { Accept: text/event-stream }
          body:
            schema: video-transcode-abr/v2
            workload_id: "cert-{{run.id}}"
            input: { download_url: "{{fixture_url.video/mp4-2s-720p}}" }
            ladder: { preset: abr-standard }
            output:
              manifest: { artifact_uri: "cert://manifest.m3u8", upload_url: "{{sink_url}}/manifest.m3u8" }
              renditions:
                "1080p": { playlist: { artifact_uri: "cert://1080p.m3u8", upload_url: "{{sink_url}}/1080p.m3u8" }, stream: { artifact_uri: "cert://1080p.ts", upload_url: "{{sink_url}}/1080p.ts" } }
                "720p":  { playlist: { artifact_uri: "cert://720p.m3u8",  upload_url: "{{sink_url}}/720p.m3u8" },  stream: { artifact_uri: "cert://720p.ts",  upload_url: "{{sink_url}}/720p.ts" } }
                "480p":  { playlist: { artifact_uri: "cert://480p.m3u8",  upload_url: "{{sink_url}}/480p.m3u8" },  stream: { artifact_uri: "cert://480p.ts",  upload_url: "{{sink_url}}/480p.ts" } }
                "360p":  { playlist: { artifact_uri: "cert://360p.m3u8",  upload_url: "{{sink_url}}/360p.m3u8" },  stream: { artifact_uri: "cert://360p.ts",  upload_url: "{{sink_url}}/360p.ts" } }
      # Four renditions of the same clip: the ladder's progress counts
      # every rendition, so the floor is higher than VOD's.
      - { name: usage, type: usage, config: { min_units: 100 } }
      - { name: latency, type: latency, required: false, config: { samples: 2, p50_max_ms: 30000 } }
    recertify_every_seconds: 3600

  # ---------------------------------------------------------------------
  # Live: a long-lived paid-session. The publisher ingests to the runner's
  # rtmp_url, viewers play its hls_url, and the gateway holds a grant for
  # the life of the session. Metered in seconds of output, topped up while
  # the broadcast runs — the session policy below is the operator's half
  # of that (offering-axes.md §3); the runner declares `metering:
  # runner-reported`, its descriptor schema and heartbeat cadence.
  # ---------------------------------------------------------------------
  - offering_id: "gateway-ingest"
    capability: "video:transcode.live"
    protocol: "paid-session/v1"
    price:
      amount_wei: "1000000000000"
      per_units: 1
    capacity:
      max_in_flight: 1
    extra:
      provider: "live-runner"
      video:
        task: "live-gateway-ingest"
    constraints:
      tier: "standard"
      gpu_vendor: "NVIDIA"
      region: "us-central"
    session_policy:
      attachment: external
      refill: extensible
      lease_policy: funding-tracking
      burn_rate_per_second: 1.0
      min_runway_units: 120
      runway_increment_units: 600
      heartbeat: { interval_seconds: 10, missed_threshold: 3 }
    certification:
      - { name: ready, type: readiness, config: { attempts: 5, interval_ms: 3000 } }
      # Opens a session, checks the descriptor's rtmp_url is reachable,
      # holds it open for 5 s so heartbeats and the usage callback get a
      # chance to arrive, then terminates it. The live runner validates
      # session_params on create (rtmp-hls-session/v1) and refuses a create
      # without them, so the recipe has to send a complete set: a preset it
      # ships (live-standard), the rendition it meters on, and runner-local
      # storage so certification needs no bucket. The broker adds the
      # callback coordinates itself.
      - name: open
        type: request
        config:
          session_params:
            schema: rtmp-hls-session/v1
            publisher_mode: direct-publisher
            output_profile: live-standard
            metering_rendition: "720p"
            storage: { kind: runner-local }
          reach: { field: rtmp_url }
          hold_ms: 5000
      # Not required: with no publisher on the ingest there may be no
      # output seconds to report inside the window.
      - { name: usage, type: usage, required: false, config: { min_units: 1, window_ms: 15000 } }
    recertify_every_seconds: 3600
