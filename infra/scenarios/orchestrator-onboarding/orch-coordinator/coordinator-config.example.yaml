# Orch Coordinator config — defines your fleet.
#
# Install at /opt/livepeer/coordinator-config.yaml (or wherever
# COORDINATOR_CONFIG points). The coordinator reads this file on startup
# and re-reads on SIGHUP.

identity:
  # Your orchestrator's on-chain address. Must match the address whose
  # private key signs the published manifest on your Secure Orch host.
  orch_eth_address: "0xYOUR_ORCH_ADDRESS"

# One entry per capability-broker (worker node) in your fleet. Name them
# however you like — region, hardware role, or whatever helps you keep
# track. The base_url must be reachable by gateways over TLS.
brokers:
  - name: local-rig-1
    base_url: https://rig-1.example.com
  - name: local-rig-2
    base_url: https://rig-2.example.com
  - name: eu-central
    base_url: https://eu-central.example.com
  - name: us-central
    base_url: https://us-central.example.com

publish:
  # How long downstream consumers should treat a published manifest as fresh.
  manifest_ttl: 24h

# Hot keys the cold key delegates settlement signing to (manifest spec
# 2.3.0). Each broker signs its settlement records with the key named by
# its host-config `identity.settlement_key_file`; a clearinghouse trusts a
# record only if this list carries the recovered public key with a window
# containing the record's issued_at. Public key is the uncompressed
# secp256k1 form: 0x04 + 128 hex. Rotate by adding the new key and keeping
# the outgoing one listed until its expires_at, then sign and publish.
# Omit the block entirely to publish no delegation.
#
# settlement_keys:
#   - label: rig-1
#     public_key: "0x04..."          # 0x04 + 128 hex, one per broker key
#     not_before: 2026-09-07T00:00:00Z
#     expires_at: 2027-09-07T00:00:00Z
