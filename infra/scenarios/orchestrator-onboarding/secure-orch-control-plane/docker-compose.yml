# Scenario: Secure Orch.
#
# This stack runs on the orchestrator's cold-key host: the box that holds the
# ETH keystore + password. Production deployments must run this host with NO
# inbound internet access. Outbound to the ETH RPC endpoints is required.
#
# On-disk convention assumed by the defaults:
#   /opt/livepeer/keystore.json
#   /opt/livepeer/keystore-password
#
# Services:
#   - protocol-daemon          chain reads/writes (rounds, rewards, URI)
#   - service-registry-daemon  resolves active orchestrators from chain
#   - secure-orch-console      signs candidates with the cold key
#
# orch-coordinator runs on a separate, public-facing host and is not part of
# this stack.
#
# Every optional variable carries its default inline (${VAR:-default}) so
# the .env only needs the Required section of .env.example. Required values
# fail loudly (${VAR:?message}) rather than rendering empty.

services:
  protocol-daemon:
    image: ${REGISTRY:-tztcloud}/livepeer-protocol-daemon:${TAG:-v2.0.0}
    command:
      - --mode=${PROTOCOL_MODE:-both}
      - --socket=/var/run/livepeer/protocol.sock
      - --store-path=/var/lib/livepeer/protocol.db
      # Comma-separated RPC URLs; index 0 is primary, the rest are backups.
      # The daemon's multi-RPC failover rotates on transient errors.
      - --chain-rpc-urls=${CHAIN_RPC_URLS:?set CHAIN_RPC_URLS to a comma-separated list of Arbitrum RPC endpoints, primary first}
      - --chain-id=${CHAIN_ID:-42161}
      - --controller-address=${CONTROLLER_ADDRESS:-0xD8E8328501E9645d16Cf49539efC04f734606ee4}
      - --keystore-path=/etc/livepeer/keystore.json
      - --keystore-password-file=/etc/livepeer/keystore-password
      - --orch-address=${ORCH_ADDRESS:?set ORCH_ADDRESS to your orchestrator's on-chain address}
      - --min-balance-wei=${MIN_BALANCE_WEI:-5000000000000000}
      - --log-level=${LOG_LEVEL:-info}
      - --log-format=${LOG_FORMAT:-json}
      - --metrics-listen=:${PROTOCOL_METRICS_PORT:-9094}
    ports:
      - "${PROTOCOL_METRICS_PORT:-9094}:${PROTOCOL_METRICS_PORT:-9094}"
    volumes:
      - ${KEYSTORE_FILE:-/opt/livepeer/keystore.json}:/etc/livepeer/keystore.json:ro
      - ${KEYSTORE_PASSWORD_FILE:-/opt/livepeer/keystore-password}:/etc/livepeer/keystore-password:ro
      - socket:/var/run/livepeer
      - state:/var/lib/livepeer
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  service-registry-daemon:
    image: ${REGISTRY:-tztcloud}/livepeer-service-registry-daemon:${TAG:-v2.0.0}
    command:
      - --mode=resolver
      - --socket=/var/run/livepeer/service-registry.sock
      - --store-path=/var/lib/livepeer/registry-cache.db
      # Same list as protocol-daemon; the resolver fails over between
      # entries too.
      - --chain-rpc-urls=${CHAIN_RPC_URLS:?set CHAIN_RPC_URLS to a comma-separated list of Arbitrum RPC endpoints, primary first}
      - --chain-id=${CHAIN_ID:-42161}
      - --controller-address=${CONTROLLER_ADDRESS:-0xD8E8328501E9645d16Cf49539efC04f734606ee4}
      - --service-registry-address=${SERVICE_REGISTRY_ADDRESS:-}
      - --ai-service-registry-address=${AI_SERVICE_REGISTRY_ADDRESS:-0x04C0b249740175999E5BF5c9ac1dA92431EF34C5}
      - --discovery=${DISCOVERY_MODE:-chain}
      # Prometheus listener. The published port below is inert without this
      # flag (empty --metrics-listen disables the listener). Exposes the full
      # livepeer_registry_* catalog; see docs/operations/metrics.md.
      - --metrics-listen=:${REGISTRY_METRICS_PORT:-9095}
      - --log-level=${LOG_LEVEL:-info}
      - --log-format=${LOG_FORMAT:-json}
    ports:
      - "${REGISTRY_METRICS_PORT:-9095}:${REGISTRY_METRICS_PORT:-9095}"
    volumes:
      - socket:/var/run/livepeer
      - state:/var/lib/livepeer
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  secure-orch-console:
    image: ${REGISTRY:-tztcloud}/livepeer-secure-orch-console:${TAG:-v2.0.0}
    command:
      - --keystore=v3:/var/lib/secure-orch/keystore.json
      - --keystore-password-file=/etc/secure-orch/password
      - --last-signed=/var/lib/secure-orch/last-signed.json
      - --audit-log=/var/log/secure-orch/audit.log.jsonl
      - --audit-rotate-size=104857600
      - --listen=${SECURE_ORCH_LISTEN:-0.0.0.0:8081}
    ports:
      - "${SECURE_ORCH_PORT:-8081}:8081"
    environment:
      PROTOCOL_DAEMON_SOCKET: /var/run/livepeer/protocol.sock
      SECURE_ORCH_ADMIN_TOKENS: ${SECURE_ORCH_ADMIN_TOKENS:?set SECURE_ORCH_ADMIN_TOKENS to at least one admin bearer token (openssl rand -hex 32)}
    volumes:
      # The console signs with the same cold key protocol-daemon acts as.
      - ${KEYSTORE_FILE:-/opt/livepeer/keystore.json}:/var/lib/secure-orch/keystore.json:ro
      - ${KEYSTORE_PASSWORD_FILE:-/opt/livepeer/keystore-password}:/etc/secure-orch/password:ro
      - data:/var/lib/secure-orch
      - logs:/var/log/secure-orch
      - socket:/var/run/livepeer
    restart: unless-stopped

volumes:
  logs: {}
  data: {}
  socket: {}
  state: {}
