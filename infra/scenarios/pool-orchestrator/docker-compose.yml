# Scenario: Pool orchestrator public/data-plane stack.
#
# This stack is the Pool-side equivalent of the orchestrator-onboarding public
# fleet. It runs:
#   - pool-controller
#   - capability-broker
#   - payment-daemon-receiver
#   - orch-coordinator
#   - pool-reconciler
#   - pool-payout-executor
#
# It still expects the cold/protocol host to exist separately. In particular:
#   - protocol-daemon must expose /var/run/livepeer/protocol.sock on the host
#   - your secure-orch / service-registry flow stays out of this compose file
#
# Bring-up order:
#   1. copy coordinator-config.example.yaml to coordinator-config.yaml
#      and replace the broker public URL
#   2. `docker compose up -d`
#   3. create offers, approve members, and create assignments
#      through pool-controller
#   4. apply desired broker runtime through pool-controller

services:
  payment-daemon-receiver:
    image: ${REGISTRY}/livepeer-payment-daemon:${TAG}
    command:
      - --mode=receiver
      - --socket=/var/run/livepeer/payment-daemon.sock
      - --db=/var/lib/livepeer/payment-daemon/sessions.db
      - --chain-rpc=${CHAIN_RPC}
      - --orch-address=${ORCH_ADDRESS:?set ORCH_ADDRESS}
      - --keystore-path=/etc/livepeer/keystore.json
      - --keystore-password-file=/etc/livepeer/keystore-password
      - --gas-price-multiplier-pct=${GAS_PRICE_MULT_PCT}
      - --redeem-gas=${REDEEM_GAS}
    volumes:
      - ${PAYMENT_KEYSTORE}:/etc/livepeer/keystore.json:ro
      - ${PAYMENT_KEYSTORE_PASSWORD_FILE}:/etc/livepeer/keystore-password:ro
      - ${LIVEPEER_SOCKET_DIR}:/var/run/livepeer
      - payment-daemon-db:/var/lib/livepeer/payment-daemon
    restart: unless-stopped

  capability-broker:
    image: ${REGISTRY}/livepeer-capability-broker:${TAG}
    depends_on:
      payment-daemon-receiver:
        condition: service_started
    command:
      - --config=/etc/livepeer/host-config.yaml
      - --listen=:8080
      - --metrics=:9090
    environment:
      LOG_LEVEL: ${BROKER_LOG_LEVEL}
      POOL_CONTROLLER_ADMIN_TOKEN: ${POOL_CONTROLLER_ADMIN_TOKEN}
    ports:
      - "${BROKER_PUBLIC_BIND}:${BROKER_LISTEN_PORT}:8080"
      - "${BROKER_WORKER_QUIC_BIND}:${BROKER_WORKER_QUIC_PORT}:8443/udp"
      - "${BROKER_METRICS_BIND}:${BROKER_METRICS_PORT}:9090"
    volumes:
      - ${POOL_BROKER_CONFIG}:/etc/livepeer/host-config.yaml:ro
      - ${LIVEPEER_SOCKET_DIR}:/var/run/livepeer
    restart: unless-stopped

  orch-coordinator:
    image: ${REGISTRY}/livepeer-orch-coordinator:${TAG}
    environment:
      ORCH_COORDINATOR_ADMIN_TOKENS: ${ORCH_COORDINATOR_ADMIN_TOKENS}
    command:
      - --config=/etc/livepeer/orch-coordinator.yaml
      - --data-dir=/srv/data
      - --listen=:8080
      - --public-listen=:8081
      - --metrics-listen=:9091
      - --log-level=${COORDINATOR_LOG_LEVEL}
      - --log-format=${COORDINATOR_LOG_FORMAT}
    ports:
      - "${COORDINATOR_LISTEN_PORT}:8080"
      - "${COORDINATOR_PUBLIC_PORT}:8081"
      - "${COORDINATOR_METRICS_PORT}:9091"
    volumes:
      - ${COORDINATOR_CONFIG}:/etc/livepeer/orch-coordinator.yaml:ro
      - coordinator-data:/srv/data
    restart: unless-stopped

  pool-controller:
    image: ${REGISTRY}/livepeer-pool-controller:${TAG}
    command:
      - serve
      - --config=/etc/livepeer/pool-controller.yaml
      - --data-dir=/var/lib/livepeer/pool-controller
      - --listen=:8080
    environment:
      POOL_CONTROLLER_ADMIN_TOKEN: ${POOL_CONTROLLER_ADMIN_TOKEN}
    ports:
      - "${POOL_CONTROLLER_PORT}:8080"
      - "${POOL_CONTROLLER_METRICS_PORT}:9090"
    volumes:
      - ${POOL_CONTROLLER_CONFIG}:/etc/livepeer/pool-controller.yaml:ro
      - ${POOL_CONTROLLER_DATA_DIR}:/var/lib/livepeer/pool-controller
      - ${LIVEPEER_SOCKET_DIR}:/var/run/livepeer
    restart: unless-stopped

  pool-reconciler:
    image: ${REGISTRY}/livepeer-pool-reconciler:${TAG}
    depends_on:
      - pool-controller
    command:
      - watch-rounds
      - --config=/etc/livepeer/pool-reconciler.yaml
    environment:
      POOL_CONTROLLER_ADMIN_TOKEN: ${POOL_CONTROLLER_ADMIN_TOKEN}
    volumes:
      - ${POOL_RECONCILER_CONFIG}:/etc/livepeer/pool-reconciler.yaml:ro
      - ${POOL_RECONCILER_STATE_DIR}:/var/lib/livepeer
      - ${LIVEPEER_SOCKET_DIR}:/var/run/livepeer
    restart: unless-stopped

  pool-payout-executor:
    image: ${REGISTRY}/livepeer-pool-payout-executor:${TAG}
    depends_on:
      - pool-controller
    command:
      - reconcile-loop
      - --config=/etc/livepeer/pool-payout-executor.yaml
      - --interval-ms=${POOL_PAYOUT_EXECUTOR_INTERVAL_MS}
    environment:
      POOL_CONTROLLER_ADMIN_TOKEN: ${POOL_CONTROLLER_ADMIN_TOKEN}
    volumes:
      - ${POOL_PAYOUT_EXECUTOR_CONFIG}:/etc/livepeer/pool-payout-executor.yaml:ro
      - ${POOL_PAYOUT_EXECUTOR_KEYSTORE}:/etc/livepeer/keystore.json:ro
      - ${POOL_PAYOUT_EXECUTOR_KEYSTORE_PASSWORD_FILE}:/etc/livepeer/keystore-password:ro
      - ${POOL_PAYOUT_EXECUTOR_STATE_DIR}:/var/lib/livepeer
    restart: unless-stopped

volumes:
  payment-daemon-db: {}
  coordinator-data: {}
