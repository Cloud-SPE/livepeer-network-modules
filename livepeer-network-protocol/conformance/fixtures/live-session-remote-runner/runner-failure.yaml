# Runner-failure conformance fixture for live-session-remote-runner@v0.

name: runner-failure
mode: live-session-remote-runner@v0
spec_version: "0.1"
description: |
  Runner reports session.failed. Broker persists failed state, preserves the
  runner-provided close reason, and closes payment state without creating a new
  logical live session.

setup:
  capability:
    id: video:transcode.live
    offering_id: runner-failure
    interaction_mode: live-session-remote-runner@v0
    work_unit:
      name: output_seconds
      extractor:
        type: seconds-elapsed
        granularity: 1
    price:
      amount_wei: "1"
      per_units: 1
    backend:
      transport: remote-live-runner
      url: http://mock-live-runner:8080

request:
  method: POST
  path: /v1/cap
  headers:
    Livepeer-Capability: video:transcode.live
    Livepeer-Offering: runner-failure
    Livepeer-Payment: <runner-generated-payment-blob>
    Livepeer-Spec-Version: "0.1"
    Livepeer-Mode: live-session-remote-runner@v0
    Content-Type: application/json
  body: |
    {"gateway_session_id":"gw-123","session_params":{"name":"launch-stream"}}

backend_response:
  status: 0
  body: ""

response_expect:
  status: 200
  body_fields_present:
    - broker_session_id
    - runner_session_id
