# Topup + status + end conformance fixture for live-session-remote-runner@v0.

name: topup-status-end
mode: live-session-remote-runner@v0
spec_version: "0.1"
description: |
  After session open, the runner reports publishing state, the gateway tops up
  the same broker session, fetches status, and ends the session idempotently.

setup:
  capability:
    id: livepeer:transcode/live-rtmp-hls-abr-topup
    offering_id: default
    interaction_mode: live-session-remote-runner@v0
    work_unit:
      name: output_seconds
      extractor:
        type: seconds-elapsed
        granularity: 1
    price:
      amount_wei: "1"
      per_units: 1
    backend:
      transport: remote-live-runner
      url: http://mock-live-runner:8080

request:
  method: POST
  path: /v1/cap
  headers:
    Livepeer-Capability: livepeer:transcode/live-rtmp-hls-abr-topup
    Livepeer-Offering: default
    Livepeer-Payment: <runner-generated-payment-blob>
    Livepeer-Spec-Version: "0.1"
    Livepeer-Mode: live-session-remote-runner@v0
    Content-Type: application/json
  body: |
    {"gateway_session_id":"gw-123","session_params":{"name":"launch-stream"}}

backend_response:
  status: 0
  body: ""

response_expect:
  status: 200
  body_fields_present:
    - broker_session_id
    - control.topup_url
    - control.status_url
    - control.end_url
