// Livepeer Payments v1 — PayeeDaemon service.
//
// The PayeeDaemon runs next to a payee application — a Livepeer
// orchestrator or any consumer app accepting payment for work. It
// validates incoming payment blobs, tracks per-(sender, work_id)
// balances, and (post chain integration) redeems winning tickets
// on-chain via the TicketBroker.
//
// Mounted only when the daemon is started with `--mode=receiver`.
// Calls to it in sender mode return UNIMPLEMENTED.
//
// This service is NOT part of the wire-compat contract; it is a
// daemon↔consumer-app contract that may evolve under v1. See
// `../docs/wire-compat.md`.

syntax = "proto3";

package livepeer.payments.v1;

import "livepeer/payments/v1/types.proto";

option go_package = "github.com/Cloud-SPE/livepeer-network-modules/livepeer-network-protocol/proto-go/livepeer/payments/v1;paymentsv1";

service PayeeDaemon {
  // Return the TicketParams and per-offering pricing for a (sender,
  // capability) pair. The payer app queries this via its PayeeApp
  // peer and hands the result to its own PayerDaemon when starting a
  // session. One TicketParams covers every offering on the capability;
  // per-offering prices are carried in `offering_prices` and are what
  // the payer checks against when billing.
  rpc GetQuote(GetQuoteRequest) returns (GetQuoteResponse);

  // Return canonical payee-issued TicketParams for a sender/payee
  // session. This is the v3 quote-free replacement for the
  // cryptographic half of the old quote flow: pricing comes from
  // manifest / resolver, while the payee still owns
  // recipientRandHash and expiry generation.
  //
  // The same open session MUST return the same TicketParams when the
  // caller repeats the same (sender, recipient, capability, offering)
  // request, including across payee-daemon restarts. A fresh
  // recipientRandHash is minted only after the prior session has been
  // explicitly closed or reset.
  rpc GetTicketParams(GetTicketParamsRequest) returns (GetTicketParamsResponse);

  // Return the daemon's full configured capability catalog. Drives
  // the worker's `/capabilities` HTTP response.
  rpc ListCapabilities(ListCapabilitiesRequest) returns (ListCapabilitiesResponse);

  // Open a payee-side session and bind authoritative pricing metadata
  // to `work_id`. The worker later seals the session's sender on the
  // first successful ProcessPayment.
  rpc OpenSession(OpenSessionRequest) returns (OpenSessionResponse);

  // Validate an incoming payment blob, credit the sender's balance by
  // the payment's expected value, and queue any winning tickets for
  // redemption. Requires a previously-opened session for `work_id`.
  rpc ProcessPayment(ProcessPaymentRequest) returns (ProcessPaymentResponse);

  // Debit session-priced work units from a (sender, work_id) balance
  // after the payee has actually done the work. Retries are
  // idempotent by `(sender, work_id, debit_seq)`. Returns the new
  // balance.
  rpc DebitBalance(DebitBalanceRequest) returns (DebitBalanceResponse);

  // Check whether a (sender, work_id) balance covers a minimum number
  // of session-priced work units, without debiting.
  rpc SufficientBalance(SufficientBalanceRequest) returns (SufficientBalanceResponse);

  // Get the current balance for a (sender, work_id) pair.
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);

  // Close and garbage-collect a work session. Any residual credit is
  // forfeited.
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);

  // Admin / observability: list winning tickets currently queued for
  // on-chain redemption.
  rpc ListPendingRedemptions(ListPendingRedemptionsRequest) returns (ListPendingRedemptionsResponse);

  // Admin / observability: return the on-chain redemption status of
  // a previously-identified winning ticket.
  rpc GetRedemptionStatus(GetRedemptionStatusRequest) returns (GetRedemptionStatusResponse);

  // Admin / reconciliation: aggregate confirmed redemption revenue
  // for a single Livepeer round. Revenue is recognized only for
  // confirmed on-chain redemptions, not merely queued winners.
  rpc GetRoundRevenue(GetRoundRevenueRequest) returns (GetRoundRevenueResponse);

  // Health returns "ok" if the daemon is ready to accept sessions.
  // The broker calls this once at startup before binding its paid
  // listener.
  rpc Health(HealthRequest) returns (HealthResponse);
}

// ─── GetQuote ─────────────────────────────────────────────────────────

message GetQuoteRequest {
  // ETH address of the sender asking for a quote.
  bytes sender = 1;

  // Capability the sender intends to purchase. The daemon maps this
  // to the `PriceInfo.capability` uint32 at the wire boundary. One
  // capability may host many offerings; the response lists them all.
  string capability = 2;
}

message GetQuoteResponse {
  // Single TicketParams for this (sender, capability). Face value is
  // sized to cover the most expensive offering on this capability so
  // one session covers the whole offering set without re-keying
  // RecipientRandHash per offering.
  TicketParams ticket_params = 1;

  // Per-offering pricing. Ordered by offering id for deterministic
  // comparison on the bridge's quote-refresh cycle. Empty iff the
  // daemon has no offerings configured for this capability (caller
  // should treat as NotFound).
  repeated OfferingPrice offering_prices = 2;
}

// ─── GetTicketParams (quote-free) ─────────────────────────────────────

message GetTicketParamsRequest {
  // ETH address of the sender that will sign the ticket.
  bytes sender = 1;

  // ETH address of the intended recipient. Must match the receiver
  // daemon's configured recipient when provided.
  bytes recipient = 2;

  // Target spend / expected-value request in wei, big-endian bytes,
  // for the quote-free sender/payee flow. The receiver may return a
  // larger TicketParams.face_value when redemption economics require
  // a redeemable winning ticket, paired with a lower win probability
  // so expected spend stays aligned with this request.
  bytes face_value = 3;

  // Optional capability / offering metadata for logging and future
  // metrics.
  string capability = 4;
  string offering = 5;
}

message GetTicketParamsResponse {
  TicketParams ticket_params = 1;

  // Set when answering this call ROTATED the ticket session: the work_id
  // the returned params supersede.
  //
  // A recipient rand tracks a bounded number of sender nonces, so a
  // long-lived session eventually exhausts its budget and the payee
  // mints a fresh rand. That changes work_id, and a changed work_id must
  // never arrive silently — a consumer keying evidence on it would
  // otherwise attribute the successor's payments to nothing, or to the
  // predecessor.
  //
  // Empty on the ordinary path, which is almost every call.
  string predecessor_work_id = 2;

  // The highest sender nonce this payee has already recorded against the
  // returned recipient rand, and whether it has recorded any.
  //
  // A sender allocates nonces from its own durable counter. If that
  // counter is lost — a restored backup, a wiped volume — the sender
  // rewinds and every nonce it produces has already been seen here, so
  // every payment is refused as a replay, credits nothing, and it can
  // never make progress on this rand again. It cannot detect this
  // itself: from its side a replay rejection looks the same as a
  // duplicate delivery.
  //
  // So the payee states what it has seen, and a sender resumes ABOVE it.
  // Reported at quote time rather than in a rejection, because that is
  // before anything is signed: the loss heals on the next mint instead
  // of costing a refused payment first.
  uint32 highest_seen_nonce = 3;
  bool has_seen_nonces = 4;
}

// ─── ListCapabilities ─────────────────────────────────────────────────

message ListCapabilitiesRequest {}

message ListCapabilitiesResponse {
  // Full capability catalog as parsed by the daemon at startup.
  // Ordered by capability string, then offering id, for deterministic
  // comparison.
  repeated CapabilityEntry capabilities = 1;
}

// ─── Sessions ─────────────────────────────────────────────────────────

message OpenSessionRequest {
  // Opaque session identifier chosen by the payee app.
  string work_id = 1;

  // Capability the session is opened against.
  string capability = 2;

  // Offering the session is opened against.
  string offering = 3;

  // Authoritative price for `per_units` work units (wei, big-endian
  // bytes). NOT necessarily the price of one unit — read it with
  // `per_units`, never alone.
  bytes price_per_work_unit_wei = 4;

  // Work-unit identifier for this session ("token", "second", ...).
  string work_unit = 5;

  // Denominator of the price: `price_per_work_unit_wei` buys this many
  // work units. 0 is read as 1. Carrying it lets an offering price
  // below 1 wei per unit, which token-metered workloads need; dropping
  // it makes the ledger debit `per_units` times the intended rate.
  //
  // The daemon bills cumulatively —
  // `bill(U) = ceil(U * price / per_units)` over units debited since
  // open — and charges each debit the difference between successive
  // cumulative bills. Rounding each debit on its own would let a long
  // session accumulate up to one wei of drift per debit.
  uint64 per_units = 6;
}

message OpenSessionResponse {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    OUTCOME_OPENED = 1;
    OUTCOME_ALREADY_OPEN = 2;
  }
  Outcome outcome = 1;
}

message ProcessPaymentRequest {
  // Wire-format `livepeer.payments.v1.Payment` bytes, exactly as
  // received from the sender (after base64-decoding the
  // `Livepeer-Payment` HTTP header).
  bytes payment_bytes = 1;

  // Opaque session identifier chosen by the payee app. The daemon
  // requires a previously-opened session with this id.
  string work_id = 2;
}

message ProcessPaymentResponse {
  // Sender address extracted from the validated payment.
  bytes sender = 1;

  // Expected value credited to the sender's balance by this payment
  // (wei, big-endian bytes).
  bytes credited_ev = 2;

  // New balance after crediting (wei, big-endian bytes).
  bytes balance = 3;

  // Number of tickets in this payment that were identified as winners
  // and queued for on-chain redemption.
  int32 winners_queued = 4;

  // Per-ticket validation / credit result, in the same order as the
  // input payment's `ticket_sender_params`.
  repeated TicketStatus ticket_status = 5;

  // Number of tickets rejected from this payment.
  int32 tickets_rejected = 6;

  // Dominant rejection reason across the rejected tickets. UNSPECIFIED
  // when no tickets were rejected.
  PaymentRejectionReason dominant_rejection = 7;
}

message DebitBalanceRequest {
  // Sender whose balance is being debited.
  bytes sender = 1;

  // Work session whose balance is being debited.
  string work_id = 2;

  // Number of work units actually consumed.
  int64 work_units = 3;

  // Monotonic debit sequence number within the session. Retries of
  // the same logical debit MUST reuse the same value.
  uint64 debit_seq = 4;
}

message DebitBalanceResponse {
  // New balance after debit (wei, big-endian bytes). Negative values
  // indicate overdraft; callers should stop serving work when this
  // happens.
  bytes balance = 1;

  // What this debit actually CHARGED, in wei.
  //
  // Returned rather than left for the caller to recompute. Billing is
  // cumulative — a debit costs bill(total_after) - bill(total_before) —
  // so the charge depends on the session's running total, and a caller
  // recomputing it from the units alone gets a different number whenever
  // a remainder is carried. That is not hypothetical: a broker attested
  // 5 wei in a signed settlement for a debit the ledger charged 4, and
  // the two disagreed by exactly the carried remainder.
  //
  // The ledger is the authority on what was charged. It says so here.
  BigUInt debited_wei = 2;

  // Cumulative work units debited on this (sender, work_id) after this
  // debit. Carried so a settlement record can state its position in the
  // cumulative curve, which is what makes the charge verifiable from the
  // record alone rather than from the session's whole history.
  uint64 cumulative_units = 3;

  // Zero when the debit was deduplicated as a replay: nothing was
  // charged and the totals did not move. Distinguishes "already applied"
  // from "applied and cost nothing".
  bool replayed = 4;
}

message SufficientBalanceRequest {
  bytes sender = 1;
  string work_id = 2;
  // Minimum required runway in session-priced work units.
  int64 min_work_units = 3;
}

message SufficientBalanceResponse {
  bool sufficient = 1;
  // Current balance (wei, big-endian bytes).
  bytes balance = 2;
}

message GetBalanceRequest {
  bytes sender = 1;
  string work_id = 2;
}

message GetBalanceResponse {
  bytes balance = 1;
}

message CloseSessionRequest {
  bytes sender = 1;
  string work_id = 2;
}

message CloseSessionResponse {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    OUTCOME_CLOSED = 1;
    OUTCOME_ALREADY_CLOSED = 2;
  }
  Outcome outcome = 1;
}

// ─── Redemption observability ─────────────────────────────────────────

message ListPendingRedemptionsRequest {
  // Optional: filter to tickets queued on or after this Unix epoch
  // seconds.
  int64 since = 1;
}

message ListPendingRedemptionsResponse {
  repeated PendingRedemption redemptions = 1;
}

message GetRedemptionStatusRequest {
  bytes ticket_hash = 1;
}

message GetRedemptionStatusResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_QUEUED = 1;
    STATUS_SUBMITTED = 2;
    STATUS_CONFIRMED = 3;
    STATUS_FAILED = 4;
  }
  Status status = 1;

  // Transaction hash once submitted; empty before then.
  bytes tx_hash = 2;

  // Non-empty when status is STATUS_FAILED — operator-actionable
  // message.
  string error = 3;
}

message GetRoundRevenueRequest {
  int64 round_id = 1;
}

message GetRoundRevenueResponse {
  int64 round_id = 1;
  bytes confirmed_revenue_wei = 2;
  uint64 confirmed_ticket_count = 3;
}

// ─── Health ───────────────────────────────────────────────────────────
//
// HealthRequest / HealthResponse live in types.proto (shared with PayerDaemon).
