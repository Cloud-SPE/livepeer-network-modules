# openai-embeddings-runner sidecar — sits between the capability
# broker and an OpenAI-compatible embeddings backend (vLLM-in-embed
# mode or Ollama). Reads usage.total_tokens from the response body and
# emits it as the X-Livepeer-Work-Units response header the broker
# bills against via the response-header extractor.
#
# Pair with either:
#   - docker-compose.vllm.embeddings.yml   (UPSTREAM_KIND=vllm)
#   - docker-compose.ollama.yml            (UPSTREAM_KIND=ollama)
#
# Both stacks must join the same `ingress` network so the broker can
# resolve `openai_embeddings_runner` by name and the runner can resolve
# its upstream by name.

services:
  openai_embeddings_runner:
    image: ${REGISTRY:-tztcloud}/openai-embeddings-runner:${TAG:-v1.1.0}
    container_name: openai_embeddings_runner
    hostname: openai_embeddings_runner
    environment:
      - RUNNER_ADDR=:8080
      # Choose ONE upstream. vLLM (single model, fast) OR Ollama (multi-model, lazy).
      - UPSTREAM_URL=${UPSTREAM_URL:-http://vllm_embeddings:8000/v1/embeddings}
      - UPSTREAM_KIND=${UPSTREAM_KIND:-vllm}
      - CAPABILITY_NAME=openai-text-embeddings
      - USAGE_FIELD=${USAGE_FIELD:-total_tokens}
      - MODEL_DISCOVERY_RETRIES=${MODEL_DISCOVERY_RETRIES:-10}
      # Discovery metadata — broker hydrates these into host-config extras.
      - SERVED_MODEL_NAME=${SERVED_MODEL_NAME:-}
      - BACKEND_MODEL=${BACKEND_MODEL:-}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-0}
      - MAX_INPUT_TOKENS=${MAX_INPUT_TOKENS:-0}
      - POOLING_MODE=${POOLING_MODE:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  default:
    name: ingress
    external: true
