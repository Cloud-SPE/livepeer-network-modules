# Example coordinator-config.yaml.
#
# Mount this file at /etc/livepeer/orch-coordinator.yaml (the default
# --config location). Edit the broker list, the orch eth_address, and
# any tunables; restart to pick up changes.
#
# Brokers are LAN-private. The coordinator polls each every
# --scrape-interval (default 30s) with --scrape-timeout (default 5s).
# Per-broker base_url should be the broker's HTTP base path (the
# coordinator appends /registry/offerings, /registry/health and
# /registry/settlement-keys).

identity:
  orch_eth_address: "0x1234567890abcdef1234567890abcdef12345678"

brokers:
  - name: broker-a
    base_url: http://10.0.0.5:8080
  - name: broker-b
    base_url: http://10.0.0.6:8080

publish:
  manifest_ttl: 24h
  # Window assigned to a settlement key a broker announces without one.
  # Default one year, minimum 24h. Re-anchors at two thirds elapsed.
  # settlement_key_validity: 8760h

# Settlement key delegation is discovered, not authored: each broker
# announces its key at GET /registry/settlement-keys, signed by the key
# itself, and the coordinator carries a proven key into the candidate with
# a window of publish.settlement_key_validity from first sight (remembered
# in <data-dir>/settlement-keys.json). Rotation happens on the broker;
# nothing here changes. Pin a key below only for a broker that cannot
# announce one (older build), or to choose the window yourself. Pinned
# keys win over announced ones; keys the live manifest still delegates are
# carried until their window closes.
#
# settlement_keys:
#   - label: rig-1
#     public_key: "0x04..."          # 0x04 + 128 hex
#     not_before: 2026-09-07T00:00:00Z
#     expires_at: 2027-09-07T00:00:00Z
