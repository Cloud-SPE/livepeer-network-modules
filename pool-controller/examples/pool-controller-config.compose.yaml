identity:
  orch_eth_address: 0x1234567890abcdef1234567890abcdef12345678
  label: pool-orch

# The curated workload catalog (plan 0044 §3.2). Templates are files,
# reviewed in version control; this pool decides which of them it
# enables and what it charges, through PUT /admin/v1/template-overrides/{id}.
template_catalog_dir: /etc/livepeer/templates

admin_auth:
  bearer_token_ref: env://POOL_CONTROLLER_ADMIN_TOKEN

listen:
  paid: ":8080"
  metrics: ":9090"
  worker_quic: ":8443"

payment_daemon:
  socket: /var/run/livepeer/payment-daemon.sock

receipt_sink:
  url: http://pool-controller:8080
  timeout_ms: 1500
  auth:
    method: bearer
    secret_ref: env://POOL_CONTROLLER_ADMIN_TOKEN

bootstrap:
  public_controller_url: https://pool.example.com
  public_broker_url: https://pool.example.com
  public_broker_quic_addr: pool.example.com:8443
