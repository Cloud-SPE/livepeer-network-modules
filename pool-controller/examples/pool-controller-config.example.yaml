identity:
  orch_eth_address: 0x1234567890abcdef1234567890abcdef12345678
  label: pool-a

admin_auth:
  bearer_token_ref: env://POOL_CONTROLLER_ADMIN_TOKEN

listen:
  paid: ":8080"
  metrics: ":9090"

synthetic_probes:
  enabled: false
  interval_ms: 30000
  timeout_ms: 3000

scoring:
  cooldown_duration_ms: 300000
  cooldown_failure_trigger: 5
  ema_half_life_ms: 86400000
  latency_target_ms: 1200
  recent_window_stale_after_ms: 300000
  window_score_weight: 0.7
  ema_score_weight: 0.3
  warmup_modifier: 0.25
  warmup_exit_samples: 20
  top_degraded_limit: 10
  top_excluded_limit: 10
  worst_offerings_limit: 10
  public_worst_offerings_limit: 5

payment_daemon:
  socket: /var/run/livepeer/payment-daemon.sock

members:
  - eth_address: 0xaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    display_name: west-vllm
    payout_mode: onchain
    backends:
      - id: west-vllm-chat
        transport: http
        url: http://10.0.0.10:8000/v1/chat/completions
        auth: none
        offerings:
          - capability_id: openai:chat-completions
            offering_id: llama-3-70b
            interaction_mode: http-stream@v0
            work_unit:
              name: tokens
              extractor:
                type: openai-usage
                field: total_tokens
            price:
              amount_wei: "1500000"
              per_units: 1
            health:
              probe:
                type: http-openai-model-ready
                interval_ms: 5000
                timeout_ms: 1500
                unhealthy_after: 2
                healthy_after: 1
                config:
                  url: http://10.0.0.10:8000/v1/models
                  expect_model: llama-3-70b
            extra:
              openai:
                model: llama-3-70b
              provider: vllm
  - eth_address: 0xbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    display_name: east-vllm
    payout_mode: manual
    backends:
      - id: east-vllm-chat
        transport: http
        url: http://10.0.0.11:8000/v1/chat/completions
        auth:
          method: bearer
          secret_ref: env://EAST_EMBEDDINGS_TOKEN
        offerings:
          - capability_id: openai:chat-completions
            offering_id: llama-3-70b
            interaction_mode: http-stream@v0
            work_unit:
              name: tokens
              extractor:
                type: openai-usage
                field: total_tokens
            price:
              amount_wei: "1500000"
              per_units: 1
            health:
              probe:
                type: http-openai-model-ready
                interval_ms: 5000
                timeout_ms: 1500
                unhealthy_after: 2
                healthy_after: 1
                config:
                  url: http://10.0.0.11:8000/v1/models
                  expect_model: llama-3-70b
            extra:
              openai:
                model: llama-3-70b
              provider: vllm
