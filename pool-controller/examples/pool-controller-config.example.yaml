identity:
  orch_eth_address: 0x1234567890abcdef1234567890abcdef12345678
  label: pool-a

# The curated workload catalog (plan 0044 §3.2). Templates are files,
# reviewed in version control; this pool decides which of them it
# enables and what it charges, through PUT /admin/v1/template-overrides/{id}.
template_catalog_dir: ../templates

admin_auth:
  bearer_token_ref: env://POOL_CONTROLLER_ADMIN_TOKEN

listen:
  paid: ":8080"
  metrics: ":9090"


scoring:
  cooldown_duration_ms: 300000
  cooldown_failure_trigger: 5
  ema_half_life_ms: 86400000
  latency_target_ms: 1200
  recent_window_stale_after_ms: 300000
  window_score_weight: 0.7
  ema_score_weight: 0.3
  warmup_modifier: 0.25
  warmup_exit_samples: 20
  top_degraded_limit: 10
  top_excluded_limit: 10
  worst_offerings_limit: 10
  public_worst_offerings_limit: 5

bootstrap:
  broker_admin_url: http://broker-admin.local
  broker_admin_timeout_ms: 5000

payment_daemon:
  socket: /var/run/livepeer/payment-daemon.sock
