      - type: bind
        source: /var/lib/livepeer-resource-admission/v1/c0a03daa992a6554643bd62c/lock.mutex
        target: /var/lib/livepeer-resource-admission/v1/c0a03daa992a6554643bd62c/lock.mutex
    deploy:
