# Run-only compose for pool-payout-executor. Build via
# `./infra/scripts/build-images.sh pool-payout-executor`.
#
# Expected dependencies:
#   - pool-controller reachable at the URL in the mounted config
#   - Arbitrum RPC URL in the mounted config
#   - executor keystore + password file

services:
  pool-payout-executor:
    image: ${REGISTRY:-tztcloud}/livepeer-pool-payout-executor:${TAG:-v1.3.3}
    command:
      - reconcile-loop
      - --config=/etc/livepeer/pool-payout-executor.yaml
      - --interval-ms=${POOL_PAYOUT_EXECUTOR_INTERVAL_MS:-5000}
    environment:
      POOL_CONTROLLER_ADMIN_TOKEN: ${POOL_CONTROLLER_ADMIN_TOKEN:-}
    volumes:
      - ${POOL_PAYOUT_EXECUTOR_CONFIG:-../examples/pool-payout-executor-config.compose.yaml}:/etc/livepeer/pool-payout-executor.yaml:ro
      - ${POOL_PAYOUT_EXECUTOR_KEYSTORE:-../examples/keystore.json}:/etc/livepeer/keystore.json:ro
      - ${POOL_PAYOUT_EXECUTOR_KEYSTORE_PASSWORD_FILE:-../examples/keystore-password}:/etc/livepeer/keystore-password:ro
      - ${POOL_PAYOUT_EXECUTOR_STATE_DIR:-./run/data}:/var/lib/livepeer
    restart: unless-stopped
