pool_controller:
  url: http://pool-controller:8080
  bearer_token_ref: env://POOL_CONTROLLER_ADMIN_TOKEN
  timeout_ms: 1500

executor:
  batch_size: 25
  executor_id: executor-a
  lease_ttl_seconds: 300
  # YAML list, primary first; every chain call fails over between entries.
  # The CHAIN_RPC_URLS environment variable (comma-separated), when set,
  # replaces this list — compose stacks set it so a host has one RPC list.
  # Public endpoints shown as an example only.
  rpc_urls:
    - https://arb1.arbitrum.io/rpc
    - https://arbitrum.publicnode.com
  chain_id: 42161
  keystore_path: ./keystore.json
  keystore_password_path: ./keystore-password
  # Blocks a payout must be mined before it is reported paid; the intent
  # processor waits for confirmation_blocks - 1 blocks after inclusion
  # (minimum one).
  confirmation_blocks: 1
  # Durable transaction-intent store (tx hash + nonce per payout). Default:
  # payout-intents.db beside state_path. Keep it with state_path.
  # intent_store_path: ./var/pool-payout-executor/payout-intents.db
  # A broadcast payout unmined for this long is re-signed at the same nonce
  # with 11% more gas, up to max_replacements times (chain-commons defaults
  # 300 s / 3). Uncomment to tune.
  # replace_after_seconds: 300
  # max_replacements: 3
  # How long a confirm pass waits for an in-flight payout before reporting
  # it pending (ms). The processor keeps tracking in the background.
  # confirm_wait_ms: 2000
  state_path: /var/lib/livepeer/pool-payout-executor-state.db
  run_history_limit: 100
  backoff_base_ms: 5000
  backoff_max_ms: 300000
  auto_requeue_failed: false
  max_retries: 3
  requeue_cooldown_seconds: 3600
