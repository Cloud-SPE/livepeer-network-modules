# Run-only compose for pool-reconciler. Build via
# `./infra/scripts/build-images.sh pool-reconciler`.
#
# Expected dependencies:
#   - pool-controller reachable at the URL in the mounted config
#   - protocol-daemon UDS mounted into /var/run/livepeer
#   - payment-daemon UDS mounted into /var/run/livepeer

services:
  pool-reconciler:
    image: ${REGISTRY}/livepeer-pool-reconciler:${TAG}
    command:
      - watch-rounds
      - --config=/etc/livepeer/pool-reconciler.yaml
    environment:
      POOL_CONTROLLER_ADMIN_TOKEN: ${POOL_CONTROLLER_ADMIN_TOKEN}
    volumes:
      - ${POOL_RECONCILER_CONFIG}:/etc/livepeer/pool-reconciler.yaml:ro
      - ${POOL_RECONCILER_STATE_DIR}:/var/lib/livepeer
      - ${LIVEPEER_SOCKET_DIR}:/var/run/livepeer
    restart: unless-stopped
