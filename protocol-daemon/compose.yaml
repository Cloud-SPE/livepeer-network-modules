# Local-dev compose for protocol-daemon. This mirrors the run-only
# compose under `compose/docker-compose.yml` but keeps the file at the
# component root for parity with older local workflows.

services:
  protocol-daemon:
    image: ${REGISTRY}/livepeer-protocol-daemon:${TAG}
    restart: unless-stopped

    command:
      - --mode=${PROTOCOL_MODE}
      - --socket=/var/run/livepeer/protocol.sock
      - --store-path=/var/lib/livepeer/protocol.db
      # Comma-separated RPC URLs; index 0 is primary, the rest are
      # backups. The daemon's multi-RPC failover rotates on transient
      # errors and rate-limits.
      - --eth-urls=${ETH_URLS}
      - --chain-id=${CHAIN_ID}
      - --controller-address=${CONTROLLER_ADDRESS}
      # LivepeerGovernor (treasury) contract — REQUIRED for treasury
      # proposal voting. Without it, CastVote / GetTreasuryProposal return
      # Unimplemented. Empty = treasury voting disabled.
      - --treasury-address=${PROTOCOL_TREASURY_ADDRESS}
      - --keystore-path=/etc/livepeer/keystore.json
      - --keystore-password-file=/etc/livepeer/keystore-password
      # The orchestrator's on-chain transcoder address. The keystore above
      # MUST be this address's key: reward / transcoder / transferBond /
      # withdrawFees / vote all act on msg.sender, so the daemon signs as
      # the orchestrator itself. Required for reward / both modes.
      - --orch-address=${ORCH_ADDRESS}
      # Preflight: refuse to start when wallet balance < this many wei.
      # Default 5e15 ≈ 0.005 ETH (~50 reward calls of headroom).
      - --min-balance-wei=${MIN_BALANCE_WEI}
      # Optional: random delay before initializeRound. Useful only if
      # you run multiple protocol-daemons that might race for the
      # round-init slot — single-orchestrator deployments leave this 0.
      # - --init-jitter=${INIT_JITTER}
      # Optional: gas limit for all on-chain txs — round-init, reward,
      # transcoder, transfer-bond, withdraw-fees, treasury vote (default 1M).
      # - --gas-limit=${GAS_LIMIT}
      # Logging — recommend json for production log aggregators.
      - --log-level=${LOG_LEVEL}
      - --log-format=${LOG_FORMAT}
      - --metrics-listen=${METRICS_PORT:+:${METRICS_PORT}}

    ports:
      - "${PROTOCOL_METRICS_BIND}:${METRICS_PORT}:${METRICS_PORT}"

    volumes:
      - ${PROTOCOL_KEYSTORE}:/etc/livepeer/keystore.json:ro
      - ${PROTOCOL_KEYSTORE_PASSWORD_FILE}:/etc/livepeer/keystore-password:ro
      - protocol-socket:/var/run/livepeer
      - protocol-state:/var/lib/livepeer

    read_only: true
    security_opt:
      - no-new-privileges:true

volumes:
  protocol-socket:
  protocol-state:
