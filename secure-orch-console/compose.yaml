# Local smoke stack for secure-orch-console.
#
# The container listens on its interface; Docker publishes only to host
# loopback. Reach it through an SSH tunnel.
#
# Set SECURE_ORCH_ADMIN_TOKENS and populate ./run/keystore.json and
# ./run/password, then run docker compose up.

services:
  secure-orch-console:
    image: ${REGISTRY:-tztcloud}/livepeer-secure-orch-console:${TAG:-v2.0.0}
    environment:
      SECURE_ORCH_ADMIN_TOKENS: ${SECURE_ORCH_ADMIN_TOKENS:?set SECURE_ORCH_ADMIN_TOKENS}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./run:/srv
    command:
      - --keystore=v3:/srv/keystore.json
      - --keystore-password-file=/srv/password
      - --last-signed=/srv/lib/last-signed.json
      - --audit-log=/srv/log/audit.log.jsonl
      - --listen=0.0.0.0:8080
