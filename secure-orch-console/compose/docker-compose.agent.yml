# Overlay: enable the plan 0042 sign-cycle agent.
#
# Layer on top of docker-compose.yml. Prerequisites in ./run/ (the
# console refuses to boot on a missing/invalid policy):
#   ./run/agent-token       — `openssl rand -hex 32`; the SAME file goes
#                             to the coordinator's --agent-token-file
#   ./run/sign-policy.json  — copy ../examples/sign-policy.json
#                             (phase-1 defaults: renewals only)
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.agent.yml up -d
#
# See ../docs/operator-runbook.md § "Agent mode" for the policy
# envelope, burn-in procedure, kill switches, and the mandatory
# manifest-expiry alert.

services:
  secure-orch-console:
    # NOTE: compose overlays replace `command` wholesale, so the base
    # flags are restated here. Keep in sync with docker-compose.yml.
    command:
      - --keystore=v3:/var/lib/secure-orch/keystore.json
      - --keystore-password-file=/etc/secure-orch/password
      - --last-signed=/var/lib/secure-orch/last-signed.json
      - --audit-log=/var/log/secure-orch/audit.log.jsonl
      - --audit-rotate-size=${AUDIT_ROTATE_SIZE}
      - --listen=${SECURE_ORCH_LISTEN}
      # --- agent mode (plan 0042) ---
      - --agent
      - --coordinator-url=${COORDINATOR_URL:?set COORDINATOR_URL to the coordinator admin base URL}
      - --coordinator-public-url=${COORDINATOR_PUBLIC_URL:?set COORDINATOR_PUBLIC_URL to the coordinator public base URL}
      - --coordinator-token-file=/etc/secure-orch/agent-token
      - --agent-policy=/etc/secure-orch/sign-policy.json
      - --agent-poll-interval=${AGENT_POLL_INTERVAL:-60s}
      - --alert-webhook-url=${ALERT_WEBHOOK_URL:-}
    volumes:
      - ${AGENT_TOKEN_FILE:-./run/agent-token}:/etc/secure-orch/agent-token:ro
      - ${SIGN_POLICY_FILE:-./run/sign-policy.json}:/etc/secure-orch/sign-policy.json:ro
