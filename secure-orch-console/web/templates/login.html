{{define "login.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>secure-orch login</title>
  <link rel="stylesheet" href="/static/console.css?v={{.AssetVersion}}">
</head>
<body>
<main class="auth-page">
  <section class="auth-card">
    <p class="eyebrow">Secure orch</p>
    <h1>Operator login</h1>
    <p class="path">Enter the secure-orch admin token and operator actor identity.</p>
    {{if .Error}}<p class="message message-error">{{.Error}}</p>{{end}}
    <form action="/login" method="post" class="login-form">
      <label for="admin_token">Admin token</label>
      <input type="password" id="admin_token" name="admin_token" autocomplete="current-password" required>
      <label for="actor">Actor</label>
      <input type="text" id="actor" name="actor" autocomplete="username" required>
      <button type="submit" class="primary-button">Start session</button>
    </form>
  </section>
</main>
</body>
</html>
{{end}}
