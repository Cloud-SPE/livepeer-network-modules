# Coordinator discovery, not a broker/runner list. The signed publication
# provides broker endpoints, capabilities, prices and settlement keys.
# Use --discovery=overlay-only to skip chain enumeration and serviceURI lookup.
# Replace both values with your orchestrator's expected identity and coordinator.
overlay:
  - eth_address: "0x0123456789abcdef0123456789abcdef01234567"
    manifest_url: "https://coordinator.example.com/.well-known/livepeer-registry.json"
    enabled: true
    weight: 100
    tier_allowed: [prepaid]
