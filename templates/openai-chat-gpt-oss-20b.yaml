# Chat completions — the pool's highest-value single-GPU workload.
#
# Family: `openai:chat-completions` (plan 0040 §4.3, row 3).

id: openai-chat-gpt-oss-20b
capability: openai:chat-completions
offering_id: gpt-oss-20b
protocol: paid-job/v1
display_name: Chat completions (gpt-oss-20b)
description: >-
  OpenAI-compatible /v1/chat/completions, unary and streaming. Metered in
  total tokens from the response usage block. A 20B-class model was chosen so
  the offering fits one 24 GB card; a 70B-class offering is a second template
  with its own hardware policy, not a price change on this one.

# Starting point, not a rate card. 5.0e7 wei per token is ~$0.086 per million
# tokens at the 2026-06-15 ETH basis used in
# docs/references/2026-06-15-openai-compatible-market-pricing.md, which is
# roughly 30% under the open-weight 20B market. Chat is the family where
# quantization changes the pool's real cost the most, so expect to override.
price_default: { amount_wei: "50000000", per_units: 1 }

# Four concurrent generations is what a continuous-batching server sustains on
# one 24 GB card before per-token latency degrades enough to matter. The queue
# is kept shallow: a chat caller notices waiting, and 0040 §9 prefers a
# 503 + Livepeer-Backoff to a long queue.
capacity: { max_in_flight: 4, queue_limit: 4 }

# Quantization is a runner-owned fact — the pool does not know whether a given
# member is serving fp8 or int8 — so it is promoted from the attach document
# rather than declared here (runner-attach.md §3.3). Once frozen it is part of
# the offer's identity: a runner that later reports a different quantization no
# longer matches.
extra_from_runner: [x-quantization]

certification:
  # Transcribed from brokerpush.CertificationPolicy, case
  # "openai:chat-completions".
  - { name: ready, type: readiness, required: true }
  - name: smoke
    type: request
    required: true
    config:
      transport: unary
      body:
        model: "{{identity.openai.model}}"
        messages:
          - { role: user, content: ping }
        max_tokens: 8
      # Content and usage both, for the same reason as embeddings: a reply
      # nobody can bill for is not a passing runner.
      assert:
        - "$.choices[0].message.content"
        - { path: "$.usage.total_tokens", min: 1 }
  - { name: usage, type: usage, required: true, config: { min_units: 1 } }
  # Not required: a slow runner is a scoring input (0040 §10), not an
  # ineligible one. The bound is on first byte because that is what a
  # streaming chat caller actually experiences.
  - { name: latency, type: latency, required: false, config: { samples: 3, p50_max_ms: 4000, measure: first_byte } }

# 0040 §4.3: "RTX 4090 / RTX 5090 by default; RTX 3090 only for
# operator-approved small or quantized models." The curated catalog ships the
# default, so rtx-3090 is absent here.
#
# The schema has no "operator-approved" flag, and deliberately so: approval is
# a decision, and the way a pool records a decision in this catalog is a diff.
# An operator who approves this model on 3090s adds rtx-3090 to the list below
# — or, better, ships a second template for the quantized offering with its own
# price and its own class list — and that change goes through review.
requirements:
  gpu_classes: [rtx-4090, rtx-5090]
  gpu_vram_min_bytes: 24000000000

# The highest in the catalog. When a 4090 or 5090 qualifies for chat and for
# anything else, chat takes the primary slot — 0040 §12.2's standing operator
# recommendation is to move eligible 4090/5090-class GPUs to high-demand chat
# and image templates.
priority: 30

# Primary only. Continuous batching claims the card's memory up front for the
# KV cache, which is precisely the footprint 0040 §4.4's "low-footprint
# secondary" carve-out excludes. It can, however, host a secondary: audio
# transcription lists rtx-4090/rtx-5090 in its own secondary_on.
stacking: { primary: true, secondary_on: [] }

# runner_compose omitted: v1 images and model IDs are still open (0040 §14).

probation: { share_ppm: 20000, max_in_flight: 1, min_jobs: 20 }

active: { share_cap_ppm: 150000 }

commission_bps: 1000
