# Image generation — the catalog's most GPU-exclusive workload.
#
# Family: `image-generation` (plan 0040 §4.3, row 5). The wire capability id
# is `openai:images-generations`; "image-generation" is the plan's family
# label, not an id the broker knows.

id: openai-images-flux-1-dev
capability: openai:images-generations
offering_id: flux-1-dev
protocol: paid-job/v1
display_name: Image generation (FLUX.1-dev)
description: >-
  OpenAI-compatible /v1/images/generations. Metered in images from the
  request's `n`, so the bill is settled before the job runs and a caller
  cannot be surprised by it.

# Starting point, not a rate card. 1.0e13 wei per image is the rounded
# `black-forest-labs/FLUX.1-dev` row of
# docs/references/2026-06-15-openai-compatible-market-pricing.md (30% under
# the $0.025/image anchor). Step count and resolution move the pool's real
# cost per image by more than any other lever in this catalog, so a pool that
# serves a non-default step count should reprice.
price_default: { amount_wei: "10000000000000", per_units: 1 }

# One at a time. A diffusion step uses the whole card; a second concurrent
# generation does not add throughput, it just makes both callers wait twice as
# long and pushes both past any latency expectation.
capacity: { max_in_flight: 1, queue_limit: 1 }

certification:
  # Transcribed from brokerpush.CertificationPolicy, case
  # "openai:images-generations".
  #
  # Provisional. Unlike chat or transcode, this shape has no counterpart in
  # certification-steps.md §7, and it is deliberately weak: it proves a
  # response with a data[0] entry came back, not that the entry is an image.
  # 0040 §8.2 wants "returns a valid image with expected dimensions/format" —
  # asserting that needs a step type that can decode the b64_json payload, so
  # revisit this list when one exists.
  - { name: ready, type: readiness, required: true }
  - name: smoke
    type: request
    required: true
    config:
      body:
        model: "{{identity.openai.model}}"
        prompt: "a probe"
        n: 1
      # min: 0 asserts presence, not size — data[0] is an object, and there
      # is nothing here to count.
      assert:
        - { path: "$.data[0]", min: 0 }
  - { name: usage, type: usage, required: true, config: { min_units: 1 } }

# 0040 §4.3 restricts this to RTX 4090 / 5090-class. This is the narrowest gate
# in the catalog and the least negotiable one: a diffusion transformer at
# useful resolutions needs both the VRAM to hold the model and the compute to
# finish a multi-step denoise before the caller's request times out. An older
# card does not degrade here, it fails.
requirements:
  gpu_classes: [rtx-4090, rtx-5090]
  gpu_vram_min_bytes: 24000000000

# Just under chat. Both are the high-demand 4090/5090 families 0040 §12.2
# recommends moving newer cards toward; chat wins the tie because its
# concurrency of 4 extracts more from one card than this family's 1.
priority: 28

# Primary only, and the strictest case for it. The model occupies the card for
# the duration of every job, so this is not a low-footprint secondary under
# 0040 §4.4 and it tolerates one less well than chat does — a co-resident
# secondary here shows up directly as slower generations.
stacking: { primary: true, secondary_on: [] }

# runner_compose omitted: v1 images and model IDs are still open (0040 §14).

# min_jobs is the lowest in the catalog because each job is expensive: 10
# generations already costs a probationary card several minutes of exclusive
# work, and the failure modes (OOM, timeout, no image) all show up in the
# first few.
probation: { share_ppm: 20000, max_in_flight: 1, min_jobs: 10 }

active: { share_cap_ppm: 150000 }

commission_bps: 1000
