# ABR / VOD transcode — the pool's entry-level workload.
#
# Family: `video:transcode.abr` (plan 0040 §4.3, row 1).

id: video-transcode-abr
capability: video:transcode.abr
offering_id: abr-default
protocol: paid-job/v1
display_name: ABR transcode (H.264 ladder)
description: >-
  Multipart source in, rendition ladder out. Metered in output seconds by the
  runner's ffmpeg-progress extractor, so a two-rendition ladder bills twice the
  wall time of a one-rendition ladder.

# Starting point, not a rate card. ~5.0e10 wei per output second is roughly
# $0.005/output-minute at the 2026-06-15 ETH basis used in
# docs/references/2026-06-15-openai-compatible-market-pricing.md — the same
# order as that reference's audio-second price. A pool that means to compete
# on transcode should set its own.
price_default: { amount_wei: "50000000000", per_units: 1 }

# Transcode saturates the encoder blocks rather than VRAM, so the limit is
# concurrency, not memory. Queue depth stays near zero per 0040 §9: a queued
# transcode is a job the broker could have given to a GPU that was free.
capacity: { max_in_flight: 2, queue_limit: 2 }

certification:
  # Transcribed from brokerpush.CertificationPolicy, case
  # "video:transcode.abr" / "video:transcode.vod". These steps are the
  # contract; the Go copy is scheduled for deletion.
  - { name: ready, type: readiness, required: true }
  - name: smoke
    type: request
    required: true
    # A 2s 720p clip through a real encode is slow next to an OpenAI ping,
    # hence the step-level override rather than the type default.
    timeout_ms: 60000
    config:
      transport: multipart
      parts:
        - { name: profiles, value: '[{"name":"720p30","width":1280,"height":720,"fps":30}]' }
        - name: source
          filename: probe.mp4
          content_type: video/mp4
          fixture: { ref: video/mp4-2s-720p }
      expect_content_type: "video/"
  - { name: usage, type: usage, required: true, config: { min_units: 1 } }
  - { name: latency, type: latency, required: false, config: { samples: 2, p50_max_ms: 20000 } }

# 0040 §4.3 admits every GPU generation the pool supports here. Transcode is
# the workload that keeps older cards earning: an encode is bounded by NVENC
# and by the encoder's own throughput, not by how much VRAM the card has, so a
# GTX 1080 produces correct renditions — just fewer per second than a 5090.
# That is a routing/score concern (0040 §10), not an eligibility one.
#
# gpu_models is deliberately empty. Model strings are exact, case-sensitive
# driver marketing names (runner-attach.md §3.1), so an allowlist of them is a
# per-board escape hatch; the class list is the policy 0040 states.
requirements:
  gpu_classes: [gtx-1080, rtx-2080, rtx-3090, rtx-4090, rtx-5090]
  # Below the 8 GiB a GTX 1080 reports, so an 8 GB card clears it.
  gpu_vram_min_bytes: 8000000000

# Lowest of the five. On a card that qualifies for anything else, that other
# thing should win the primary slot — 0040 §12.2's standing recommendation is
# "move older GPUs to transcode/ABR", which only holds if transcode loses the
# tie on newer ones.
priority: 10

# Primary only, never a secondary. Transcode is not the low-footprint rider
# 0040 §4.4 contemplates: it wants the encoder blocks and a wide PCIe window
# for the whole job, and sharing a card with a diffusion or chat runner shows
# up as dropped frames rather than as a clean slowdown.
stacking: { primary: true, secondary_on: [] }

# runner_compose is intentionally absent across this catalog: the exact v1
# images and model IDs are still open (0040 §14), and a wrong ghcr reference
# would fail at `compose up` on a member's host rather than in review here.

# 0040 §8.3: one Livepeer round of tightly capped real traffic. 2% share and a
# single in-flight job; min_jobs is high because transcode failures are bursty
# (one bad container produces many quick errors) and a small sample would
# promote on luck.
probation: { share_ppm: 20000, max_in_flight: 1, min_jobs: 30 }

# 20% ceiling — the widest of the five, because this family has the largest
# eligible fleet and concentrating it on a few hosts is the failure mode.
active: { share_cap_ppm: 200000 }

commission_bps: 1000
