# VOD transcode to AV1 on CPU — SVT-AV1.
#
# New 2026-09-02 (plan 0047, lnm-iqn). The first workload that places on a
# compute unit that is not a GPU. For VOD, SVT-AV1 on CPU is the better AV1
# encoder — quality per bit beats NVENC/QSV AV1 and it is how most AV1 VOD is
# made; GPU AV1 wins for live, where realtime matters more than the last 10%
# of compression. So this is the premium AV1 VOD path, not a fallback, and a
# member with cores and no card can earn on it.
#
# No operator rig has run this; every number here is the catalog's
# recommendation. The image is unresolved (see runner_compose).

id: video-transcode-vod-av1-cpu
capability: video:transcode.vod
offering_id: vod-av1-cpu
protocol: paid-job/v1
display_name: VOD transcode to AV1 (SVT-AV1, CPU)
description: >-
  File-in, file-out AV1 transcode on CPU with SVT-AV1. Priced per job like its
  GPU sibling, so a caller knows the cost before submitting; slower per clip
  and smaller per bit, which is the trade a VOD caller is making.

# Twice the GPU VOD rate (4.8e12 per job): a software AV1 encode occupies
# many cores for many times the wall-clock of an NVENC pass, and the output
# is worth more to the caller per byte delivered. A recommendation, not an
# operator's number — reprice against real encode times.
price_default: { amount_wei: "9600000000000", per_units: 1 }

# One at a time. SVT-AV1 parallelises across the socket's cores by itself;
# a second concurrent encode halves both rather than adding throughput.
capacity: { max_in_flight: 1, queue_limit: 2 }

extra:
  provider: transcode-runner
  video:
    task: transcode
    codec: av1
    encoder: svt-av1

constraints:
  tier: standard

# No `match:`: a transcoder is not a model, and one runner declares this
# capability on a socket.

certification:
  - { name: ready, type: readiness, required: true, config: { attempts: 3, interval_ms: 2000 } }
  - name: smoke
    type: request
    required: true
    # A 2s clip through a software AV1 encoder at a sane preset: slow next to
    # NVENC, so the bound is looser than the GPU sibling's.
    timeout_ms: 120000
    config:
      transport: stream
      body:
        source_url: "{{fixture_url.video/mp4-2s-720p}}"
        output_url: "{{sink_url}}"
        codec: av1
        profiles:
          - { name: 720p30, width: 1280, height: 720, fps: 30 }
  - { name: usage, type: usage, required: true, config: { min_units: 1 } }
  - { name: latency, type: latency, required: false, config: { samples: 2, p50_max_ms: 90000 } }

# Sockets, not cards (plan 0047): the core tiers this encode is worth
# running on. Under 16 cores a 720p AV1 encode runs slower than a caller
# will wait; 8-core sockets are left to the exception queue by name so an
# operator can widen this with evidence.
requirements:
  cpu_classes: [cpu-16, cpu-32, cpu-64]

# Priority orders templates that compete for one unit. Nothing else in the
# catalog admits a socket, so this number only matters once a second CPU
# workload exists; set beside the GPU VOD template for when it does.
priority: 23

stacking: { primary: true, secondary_on: [] }

# runner_compose omitted: no CPU transcode image exists yet. The transcode
# packet (docs/references/2026-09-02-runner-migration-packet-transcode.md)
# asks whether codecs-builder produces an SVT-AV1 build; the tag that ships
# it belongs here under the `cpu` key. Until then a socket places here and
# renders no service, which is the catalog's shape for an unresolved image.

probation: { share_ppm: 20000, max_in_flight: 1, min_jobs: 30 }

active: { share_cap_ppm: 200000 }

commission_bps: 1000
