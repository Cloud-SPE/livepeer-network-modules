# Image understanding — Florence-2-large, as run on the operator's
# "ai-rig-broker".
#
# Renamed from `openai-vision-florence-2-large` on 2026-09-01 (plan 0045 §6).
# OpenAI has no vision endpoint, so `openai:vision` claimed one that does not
# exist — and Florence-2 is not a chat model, so `openai:chat-completions` was
# wrong in the other direction. `capability_id` is opaque to the protocol
# (runner-attach.md §3.2: "no closed enum"), and this catalog already names
# products rather than endpoints (`video:transcode.vod`, `livepeer:meet/sfu-
# room`), so the id now says what the thing does.

id: vision-image-analysis-florence-2-large
capability: vision:image-analysis
offering_id: florence-2-large
protocol: paid-job/v1
display_name: Image understanding (Florence-2-large)
description: >-
  Image analysis over an OpenAI chat-completions request shape: an image goes
  in as message content, a description comes back. Metered in images, claimed
  by the runner in a response header.

# Derived 2026-09-01 (plan 0045 §6), replacing the placeholder `25000000` the
# rig's config carried with a comment saying it was a placeholder to be
# re-derived. That figure was about $0.000000043 per image at the 2026-06-15
# ETH basis — roughly 4 cents per MILLION images.
#
# Anchor: $0.0015/image, Google Cloud Vision. The closest comparable, because it
# does captioning, OCR and object detection in one call, which is Florence's
# surface. A frontier VLM's per-token vision pricing was rejected as the anchor
# because it would price a 0.77B specialist like GPT-4o. 30% under, per the
# reference's method, is $0.00105/image.
#
# Computed as exactly 15x the reference's whisper figure ($0.00007 per audio
# second -> 40592888126 wei), so it inherits the 2026-06-15 basis with no
# rounding drift and can be checked against a row already in that document.
# Derivation and provenance: docs/references/2026-09-01-vision-pricing-and-
# flux-anchor.md. The June reference is point-in-time and is not edited.
#
# Sanity: this lands image analysis at about 1/20th of a FLUX image in the same
# catalog, which is the right shape — generating an image is far more work than
# describing one — where the placeholder had it at 1/487,000th.
price_default: { amount_wei: "608893321890", per_units: 1 }

# The rig pinned no concurrency. Two in flight is pool policy: Florence-2-large
# is a 0.8B model and a single analysis is one short forward pass, so the card
# is idle between requests at a concurrency of one — but the response can carry
# a long generated description, so this is not as cheap per request as speech.
capacity: { max_in_flight: 2, queue_limit: 2 }

extra:
  provider: florence
  # The upstream weights. Worth stating: "florence-2-large" is served under
  # several fine-tunes and this is Microsoft's release.
  backend_model: microsoft/Florence-2-large
  vision:
    task: analyze

# The rig's `constraints.gpu_vendor`. Advertised for routing; the enforcement
# is `requirements.gpu_classes` below, which is NVIDIA-only anyway.
constraints:
  gpu_vendor: NVIDIA

match:
  identity.openai.model: florence-2-large

certification:
  # Runs the runner's declared probe (the rig used http-status on /healthz);
  # sufficiency only, per certification-steps.md §3.1.
  - { name: ready, type: readiness, required: true, config: { attempts: 5, interval_ms: 3000 } }
  - name: smoke
    type: request
    required: true
    config:
      # The rig serves this at the chat-completions path, so the probe is a
      # chat request carrying an image. That is the wire shape, not the
      # product: the runner declares its own `paths.invoke` and the frozen
      # offer publishes it, so a buyer still knows to use an OpenAI client
      # while the capability id says what is actually sold.
      transport: unary
      body:
        model: "{{identity.openai.model}}"
        messages:
          - role: user
            content:
              - { type: text, text: "describe this image" }
              # A 32x32 PNG inline as a data URL. `{{fixture_url.image/png-64}}`
              # would also work (certification-steps.md §4), but that makes the
              # probe depend on the runner reaching the broker's base URL, and
              # an image-understanding runner has no other reason to; inline
              # needs nothing. Any valid image will do: the assertion below is
              # that a description came back at all, not that it is a good one.
              - type: image_url
                image_url:
                  url: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAIAAAD8GO2jAAAASElEQVR42mNg4BCQUNAwsHDwCIhIyCioaOiYMGPBig07Dpy4cOPBiw8/KJYftWDUglELRi0YtWDUglELRi0YtWDUglELhooFACLx0Ez8llH7AAAAAElFTkSuQmCC"
        max_tokens: 64
      assert:
        - "$.choices[0].message.content"
  # The rig metered this from a response header. Which header and which
  # extractor reads it are runner-declared and frozen (runner-attach.md §3.2);
  # a passing step proves the header is actually being emitted, which is the
  # failure mode a header-based claim has and a usage-block one does not — a
  # runner that answers correctly and forgets the header bills zero forever.
  - { name: usage, type: usage, required: true, config: { min_units: 1 } }
  # Not required. A vision forward pass should be fast; a slow one is a scoring
  # input, not an eligibility question.
  - { name: latency, type: latency, required: false, config: { samples: 3, p50_max_ms: 5000 } }

# The rig wrote `constraints.gpu: "4090"`, `gpu_vendor: NVIDIA` — decided, so
# stated. Classes rather than model strings because a model string is the
# driver's exact case-sensitive marketing name (runner-attach.md §3.1) and an
# allowlist of them excludes rebadges and variants that are the same card for
# this purpose; `rtx-4090` is the pool's normalised class for all of them.
#
# rtx-5090 is a widening of what the operator wrote: strictly the faster card,
# and without it this template could never take a slot on the rig that runs
# chat. Delete it to hold the operator's line exactly.
#
# No gpu_vram_min_bytes: a 0.8B model needs far less than either class has, so
# a floor here would be a statement about the card that the class list already
# makes.
requirements:
  gpu_classes: [rtx-4090, rtx-5090]

# Below chat and the live session, above the batch audio families. Vision is
# interactive — a caller is usually waiting on the answer — which is what puts
# it ahead of workloads whose callers uploaded a file and went away.
priority: 20

# Primary only. A vision request is short, but the model stays resident and the
# response can be long; it is not the near-free rider that speech and Whisper
# are, and it has not been observed sharing a card here.
stacking: { primary: true, secondary_on: [] }

# runner_compose omitted: the images that serve this workload are unresolved
# (tracked as lnm-v12). The rig named a compose service, not a published image
# reference, and inventing a ghcr tag here would fail at `compose up` on a
# member's host instead of in review.

probation: { share_ppm: 20000, max_in_flight: 1, min_jobs: 20 }

active: { share_cap_ppm: 150000 }

commission_bps: 1000
